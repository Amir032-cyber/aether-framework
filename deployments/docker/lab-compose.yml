services:
  aether-core:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.core
    profiles: [lab]
    ports:
      - "127.0.0.1:8080:8080"
    networks: [aether-lab]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: "no"

  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    profiles: [lab]
    ports:
      - "127.0.0.1:3000:3000"
    networks: [aether-lab]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    restart: "no"
    healthcheck:
      test: [CMD-SHELL, "wget -q -O- http://127.0.0.1:3000/rest/products/search?q=test >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  webgoat:
    image: webgoat/webgoat:v2023.8
    profiles: [lab]
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9090:9090"
    networks: [aether-lab]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    restart: "no"
    environment:
      WEBGOAT_HOST: 0.0.0.0

  dvwa:
    image: vulnerables/web-dvwa:latest
    profiles: [lab]
    ports:
      - "127.0.0.1:8082:80"
    networks: [aether-lab]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: 0.75
    restart: "no"

  zap-baseline:
    image: zaproxy/zap-stable:2.15.0
    profiles: [tools]
    depends_on: [juice-shop]
    networks: [aether-lab]
    command: ["zap-baseline.py", "-t", "http://juice-shop:3000", "-m", "5", "-r", "/zap/wrk/juice-shop.html"]
    volumes:
      - reports:/zap/wrk
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    restart: "no"

  nmap-discovery:
    image: instrumentisto/nmap:7.95
    profiles: [tools]
    depends_on: [juice-shop, webgoat, dvwa]
    networks: [aether-lab]
    command: ["-sT", "-sV", "--version-light", "-T2", "-Pn", "-p", "80,3000,8080", "juice-shop", "webgoat", "dvwa"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    restart: "no"

  trivy-fs:
    image: aquasec/trivy:0.58.1
    profiles: [tools]
    networks: [aether-lab]
    command: ["fs", "--scanners", "secret", "--exit-code", "0", "--format", "json", "-o", "/reports/trivy.json", "/src"]
    volumes:
      - ../..:/src:ro
      - reports:/reports
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    restart: "no"

networks:
  aether-lab:
    name: aether-lab-isolated
    driver: bridge
    internal: true
    attachable: false

volumes:
  reports:
    name: aether-lab-reports
