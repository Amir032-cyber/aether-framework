name: CI

on:
  push:
    branches: [Master]
  pull_request:
    branches: [Master]

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test core and CLI
        run: cargo test -p aether-core -p aether-cli --locked

  go-modules:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        module: [modules/api-nemesis, modules/neurospoit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Test module
        working-directory: ${{ matrix.module }}
        run: go test ./...

  python-module:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install module and run tests
        working-directory: modules/auto-pentest
        run: |
          python -m pip install --upgrade pip poetry
          poetry install
          poetry run python -m unittest discover -s tests -v
